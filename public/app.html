<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyView app</title>
<meta name="theme-color" content="#F8F4E8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{var p=JSON.parse(localStorage.getItem("kv.prefs")||"{}");if(p.theme)document.documentElement.dataset.theme=p.theme}catch(e){}</script>
<link rel="preload" href="/fonts/dela-gothic-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="noise" aria-hidden="true"></div>
<div class="cursor" id="cursor" aria-hidden="true"></div>
<header class="top">
  <a class="logo" href="/" aria-label="KeyView home">
    <img src="/mascot/keykeeper-mark.svg" alt="" width="36" height="36">
    <b>Key<span>View</span></b>
  </a>
  <nav id="nav">
    <a href="#/" data-r="home">Leaderboard</a>
    <a href="#/dashboard" data-r="dashboard">Trader dashboard</a>
    <a href="#/analytics" data-r="analytics">Analytics</a>
    <a href="#/keys" data-r="keys">My keys</a>
    <a href="#/tracker" data-r="tracker">Copy tracker</a>
    <a href="#/security" data-r="security">Security</a>
    <a href="#/settings" data-r="settings">Settings</a>
    <a href="/#how" class="ext">How it works</a>
  </nav>
  <span class="right">
    <span class="badge" id="tee"></span>
    <span class="badge live" id="mode">loading</span>
    <span id="auth"></span>
  </span>
</header>
<main id="app"></main>
<script src="/cursor.js" defer></script>
<script src="/app.js" type="module"></script>
</body>
</html>
